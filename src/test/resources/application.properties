spring.application.name=healverse

# H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# Server
server.port=8080

# JWT (test-only key, not used outside tests)
app.jwt.secret=aGVhbHZlcnNlLXRlc3Qtb25seS1qd3Qta2V5LTMyYnk=

# Dummy key so the OpenAI chat bean can be constructed during context-load tests (no real calls made)
spring.ai.openai.api-key=test-key

spring.main.allow-circular-references=true

# Actuator: only the health endpoint is exposed, without component details.
# /actuator/health/liveness needs no DB; /actuator/health and /readiness include the DB check.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
