# Production profile: activate with SPRING_PROFILES_ACTIVE=prod (the Docker image does this).
# Everything not set here is inherited from application.properties.

# Hibernate only checks that the schema matches the entities; it never alters a production database.
# There is no migration tool yet, so schema changes must be applied by hand (or adopt Flyway).
# One-off escape hatch for an empty or older database: DB_DDL_AUTO=update.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=false

# API docs and Swagger UI are a development aid, not a public surface.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Finish in-flight requests (AI calls can take several seconds) before the container stops.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Never put exception text or stack traces in Spring's own error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
