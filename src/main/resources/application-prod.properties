# Production profile: activate with SPRING_PROFILES_ACTIVE=prod (the Docker image does this).
# Everything not set here is inherited from application.properties.

# Hibernate validates the schema against the entities (ddl-auto=validate from application.properties); Flyway
# migrations are the only thing that changes a production database.
spring.jpa.show-sql=false

# API docs and Swagger UI are a development aid, not a public surface.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Finish in-flight requests (AI calls can take several seconds) before the container stops.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Never put exception text or stack traces in Spring's own error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Client address for the login throttle comes from the socket. Behind a reverse proxy/load balancer that is the
# proxy, so every user would share one throttle bucket: set FORWARD_HEADERS_STRATEGY=framework (or native) then.
# Leave it at "none" if the app is reachable directly, because X-Forwarded-For can be forged by any client.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
