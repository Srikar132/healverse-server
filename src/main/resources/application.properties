spring.application.name=healverse


# PostgreSQL DB Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.pool-name=HikariPool
# Neon suspends idle compute and drops idle connections: retire pooled connections before that happens.
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=20000


# JPA / Hibernate
# Schema changes are Flyway migrations (src/main/resources/db/migration); Hibernate only checks that the
# entities match the database and never alters it. (DB_DDL_AUTO=update is a local-only escape hatch.)
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
# A database that already has tables but no Flyway history (created by Hibernate before Flyway was added) is
# baselined at V3 (it is assumed to already contain V1-V3, as the production database did) and skips them;
# an empty database runs V1 and every later migration.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3
# Responses are built from data loaded inside the service layer; no session stays open while serializing.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Server
server.port=8080
server.address = 0.0.0.0

# Spring Security / JWT
# Base64-encoded HS256 secret (>= 32 bytes). Supply via env var: JWT_SECRET (openssl rand -base64 32)
app.jwt.secret=${JWT_SECRET}
# Local development: load KEY=VALUE pairs from ./.env (git-ignored; copy .env.example). Optional, and
# real environment variables take precedence, so deployed environments need no file.
spring.config.import=optional:file:.env[.properties]
# Token lifetime in ms (default 7 days). check-auth does not extend it.
app.jwt.expiration-ms=604800000

# AI provider: Groq, through its OpenAI-compatible API (Spring AI's OpenAI client).
# base-url has no /v1: Spring AI appends /v1/chat/completions itself (Groq serves /openai/v1/...).
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
# Text chat and diet plans
spring.ai.openai.chat.options.model=${AI_TEXT_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=0.7
spring.ai.retry.max-attempts=3

# Our AI settings.
# max-tokens is sent as max_completion_tokens, which for reasoning models (gpt-oss) also covers hidden
# reasoning, so keep it above the visible answer size. Groq also counts the full value against your
# tokens-per-minute limit when a request starts (on-demand gpt-oss-120b: 8000 TPM), so do not set it higher
# than needed. Food analysis answers are short and use food-max-tokens instead.
# vision-model reads food photos (Groq preview model: re-check the Groq models page before upgrading).
app.ai.vision-model=${AI_VISION_MODEL:qwen/qwen3.8-27b}
app.ai.reasoning-effort=low
app.ai.max-tokens=3000
app.ai.food-max-tokens=1200
app.ai.temperature=0.7

chat.history.max-messages=6
chat.context.max-tokens=2000

# Logging: INFO by default. For prompt/response debugging set LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_AI=DEBUG
# (prompts contain user health data, so never leave that on in production).


# Multipart form
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator: only the health endpoint is exposed, without component details.
# /actuator/health/liveness needs no DB; /actuator/health and /readiness include the DB check.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Voice assistant (/api/voice-chat/**) is switched off: Groq's text-to-speech is preview, WAV-only and limited
# to 200 characters, which the current MP3 flow cannot use. Endpoints answer 410 Gone while this is false.
app.voice.enabled=false
