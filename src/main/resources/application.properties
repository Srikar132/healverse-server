spring.application.name=healverse


# PostgreSQL DB Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.pool-name=HikariPool


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080
server.address = 0.0.0.0

# Spring Security / JWT
# Base64-encoded HS256 secret (>= 32 bytes). Supply via env var: JWT_SECRET (openssl rand -base64 32)
app.jwt.secret=${JWT_SECRET}
# Local development: load KEY=VALUE pairs from ./.env (git-ignored; copy .env.example). Optional, and
# real environment variables take precedence, so deployed environments need no file.
spring.config.import=optional:file:.env[.properties]
# Token lifetime in ms (default 7 days). check-auth does not extend it.
app.jwt.expiration-ms=604800000

# OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY:abc}
spring.ai.openai.base-url=https://api.openai.com
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.max-tokens=2000
spring.ai.openai.chat.options.temperature=0.7

# HTTP Client Configuration for better timeout handling
spring.ai.openai.api.timeout=60s
spring.ai.retry.max-attempts=3

# Your custom AI service configuration
app.ai.max-tokens=2000
app.ai.temperature=0.7
app.ai.timeout-seconds=60
app.ai.retry.max-attempts=3
app.ai.retry.delay=1000

chat.history.max-messages=6
chat.context.max-tokens=2000

# Database configuration (existing)
# Add your database properties here

# Logging
logging.level.org.springframework.ai=DEBUG

# Prevent Jackson from writing dates as timestamps
#spring.jackson.serialization.write-dates-as-timestamps=false

# Set the date format for serialization
#spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS

spring.main.allow-circular-references=true

# Multipart form
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB