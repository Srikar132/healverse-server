# Run the API in a container:
#   docker compose up --build                      # uses the database in .env (Neon)
#   docker compose --profile local-db up --build   # also starts a local Postgres; see the notes below
#
# Configuration comes from .env (copy .env.example). Variables set there reach the container as
# environment variables, which take precedence over application.properties.
services:
  api:
    build: .
    image: healverse-server:latest
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: false   # only waits for db when the local-db profile is on

  # Optional local Postgres. To use it, set these in .env:
  #   DB_URL=jdbc:postgresql://db:5432/healverse
  #   DB_USERNAME=healverse
  #   DB_PASSWORD=<same as LOCAL_DB_PASSWORD, default "healverse">
  # Flyway creates the schema on first start.
  db:
    profiles: ["local-db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: healverse
      POSTGRES_USER: healverse
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-healverse}
    volumes:
      - healverse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healverse -d healverse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  healverse-db:
