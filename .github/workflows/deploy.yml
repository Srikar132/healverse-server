name: Deploy to EC2

# Runs on every push to main (and by hand from the Actions tab):
#   test -> build image and push to GitHub Container Registry -> deploy to the EC2 instance over SSH.
# One-time setup (instance, secrets): docs/deploy-aws-ec2.md

on:
  push:
    branches: [main]
    # Changes that cannot affect the running app do not redeploy it (workflow_dispatch below still can)
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/dependabot.yml"
      - ".gitignore"
  workflow_dispatch:

# Never run two deployments at once, and never cancel one halfway
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Third-party actions are pinned to commit SHAs (a moved tag could otherwise run foreign code with the token below);
# Dependabot (.github/dependabot.yml) proposes updates.
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        run: ./mvnw -B test

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        # GHCR image names must be lowercase
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    # Optional approval gate: Settings -> Environments -> production -> Required reviewers
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: protects against someone impersonating the server
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host ec2
            HostName ${EC2_HOST}
            User ${EC2_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      - name: Copy deployment files
        run: scp docker-compose.prod.yml ec2:/opt/healverse/docker-compose.yml && scp deploy/deploy.sh ec2:/opt/healverse/deploy.sh

      - name: Deploy
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          TAG: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The short-lived token travels over stdin, so it never appears in a process list or in the logs
        run: |
          # IMAGE/TAG are meant to expand here, on the runner, before the command is sent to the server
          # shellcheck disable=SC2029
          printf '%s' "$REGISTRY_TOKEN" | ssh ec2 \
            "IMAGE='$IMAGE' TAG='$TAG' REGISTRY_USER='$REGISTRY_USER' bash /opt/healverse/deploy.sh"
