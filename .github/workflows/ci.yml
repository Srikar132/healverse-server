name: CI

# Checks every pull request before it can be merged. Read-only: it never pushes an image or deploys
# (deployment is .github/workflows/deploy.yml, which only runs after a merge to main).

on:
  pull_request:
    branches: [main, develop]

# A new push to the same PR cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        run: ./mvnw -B test

  # Builds the production image without pushing it, so a broken Dockerfile or build step is caught in the PR
  # instead of after the merge.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
