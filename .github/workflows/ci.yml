name: CI

# Checks every pull request before it can be merged. Read-only: it never pushes an image or deploys
# (deployment is .github/workflows/deploy.yml, which only runs after a merge to main).

on:
  pull_request:
    branches: [main, develop]

# A new push to the same PR cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        run: ./mvnw -B test

  # Builds the production image without pushing it, so a broken Dockerfile or build step is caught in the PR
  # instead of after the merge.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
